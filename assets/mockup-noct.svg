<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'SF Mono','Cascadia Code','JetBrains Mono','Fira Code',monospace">
  <defs>
    <style>
      .title { fill: #e4e4e7; font-size: 14px; font-weight: 700; }
      .prompt { fill: #FA569A; font-size: 13px; }
      .cmd { fill: #F8F8F2; font-size: 13px; }
      .comment { fill: #8DA4B9; font-size: 12px; }
      .keyword { fill: #FA569A; font-size: 13px; }
      .func { fill: #5C9CE6; font-size: 13px; }
      .type { fill: #6ECBD5; font-size: 13px; }
      .str { fill: #D8D0A8; font-size: 13px; }
      .var { fill: #D19A66; font-size: 13px; }
      .num { fill: #F5A97F; font-size: 13px; }
      .gray { fill: #8DA4B9; font-size: 13px; }
      .label { fill: #6B728E; font-size: 11px; }
      .heading { fill: #9B8BF4; font-size: 14px; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#121212" rx="8"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="36" fill="#1A1A1A" rx="8"/>
  <rect x="0" y="20" width="800" height="16" fill="#1A1A1A"/>
  <circle cx="16" cy="18" r="5" fill="#FF5F56"/>
  <circle cx="32" cy="18" r="5" fill="#FFBD2E"/>
  <circle cx="48" cy="18" r="5" fill="#27C93F"/>
  <text x="400" y="24" text-anchor="middle" class="title">harpy-noct — pi coding agent</text>

  <!-- Thinking block -->
  <rect x="20" y="50" width="760" height="32" rx="4" fill="#232936" stroke="#7A8396" stroke-width="1"/>
  <text x="30" y="70" class="gray" font-style="italic">▸ thinking about your request...</text>

  <!-- Response -->
  <text x="30" y="110" class="func">Let me analyze the codebase.</text>

  <!-- Code block -->
  <rect x="30" y="125" width="740" height="145" rx="4" fill="#232936"/>
  <text x="40" y="148" class="keyword">const</text> <text x="88" y="148" class="var">api</text> <text x="104" y="148" class="gray">=</text> <text x="114" y="148" class="keyword">new</text> <text x="138" y="148" class="type">AppRouter</text><text x="210" y="148" class="gray">(</text><text x="218" y="148" class="num">42</text><text x="233" y="148" class="gray">);</text>
  <text x="40" y="168" class="keyword">async</text> <text x="82" y="168" class="keyword">function</text> <text x="150" y="168" class="func">fetchData</text><text x="215" y="168" class="gray">(</text><text x="222" y="168" class="var">id</text><text x="235" y="168" class="gray">:</text> <text x="245" y="168" class="type">UUID</text><text x="280" y="168" class="gray">)</text> <text x="290" y="168" class="gray">{</text>
  <text x="55" y="188" class="keyword">return</text> <text x="98" y="188" class="func">fetch</text><text x="132" y="188" class="gray">(</text><text x="140" y="188" class="str">"/api/users"</text><text x="225" y="188" class="gray">)</text>
  <text x="55" y="208" class="gray">  .</text><text x="62" y="208" class="func">then</text><text x="88" y="208" class="gray">(</text><text x="96" y="208" class="var">res</text> <text x="118" y="208" class="gray">=></text> <text x="132" y="208" class="var">res</text><text x="148" y="208" class="gray">.</text><text x="155" y="208" class="func">json</text><text x="180" y="208" class="gray">());</text>
  <text x="40" y="228" class="gray">}</text>
  <text x="40" y="248" class="gray" font-style="italic">  // Fetch users from the API</text>

  <!-- Tool execution -->
  <rect x="30" y="285" width="740" height="28" rx="4" fill="#1A2B1E"/>
  <text x="40" y="304" class="gray">◉</text> <text x="54" y="304" class="func">read</text> <text x="82" y="304" class="gray">─ src/api/router.ts</text>
  <text x="480" y="304" class="gray" font-size="11px">(0.3s) ✓</text>

  <rect x="30" y="318" width="740" height="28" rx="4" fill="#21181D"/>
  <text x="40" y="337" class="gray">◉</text> <text x="54" y="337" class="func">grep</text> <text x="82" y="337" class="gray">─ "export class" ─ 3 matches</text>
  <text x="480" y="337" class="gray" font-size="11px">✗ 2 results</text>

  <!-- Prompt line -->
  <rect x="20" y="365" width="760" height="34" rx="4" fill="none" stroke="#8DA4B9" stroke-width="1"/>
  <text x="30" y="388" class="keyword">❯</text> <text x="46" y="388" class="cmd">continue with the implementation</text>

  <!-- Footer -->
  <rect x="0" y="420" width="800" height="60" fill="#171B22" rx="0"/>
  <rect x="0" y="440" width="800" height="40" fill="#171B22"/>
  <rect x="20" y="430" width="120" height="24" rx="4" fill="#232936"/>
  <text x="28" y="446" class="label">● thinking: high</text>
  <rect x="155" y="430" width="160" height="24" rx="4" fill="#232936"/>
  <text x="163" y="446" class="label">◆ model: claude-4-opus</text>
  <rect x="330" y="430" width="200" height="24" rx="4" fill="#232936"/>
  <text x="338" y="446" class="label">■ context: 48% (62k/128k)</text>
  <rect x="545" y="430" width="80" height="24" rx="4" fill="#232936"/>
  <text x="553" y="446" class="label">◇ 3 tools</text>

  <!-- Thinking level border (left edge) -->
  <rect x="0" y="50" width="4" height="32" fill="#B69CFC" opacity="0.6"/>
</svg>
